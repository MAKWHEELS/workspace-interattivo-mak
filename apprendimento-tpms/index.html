<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<meta name="description" content="Procedure di apprendimento sensori TPMS MATE per marca e modello auto.">
<title>Apprendimento TPMS</title>
<style>
  :root{
    --bg:#f4f3ef; --panel:#ffffff; --panel-2:#f0eee8;
    --ink:#1a1c20; --ink-soft:#5b5e64; --hair:#d9d7cc;
    --accent:#d8322c; --accent-ink:#ffffff;
    --amber:#c98a00; --amber-bg:#fbf1d9;
    --focus:#1f6feb;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#16181d; --panel:#1e2128; --panel-2:#23262e;
      --ink:#ecece7; --ink-soft:#9a9da4; --hair:#31343d;
      --accent:#e5433d; --accent-ink:#ffffff;
      --amber:#f5b301; --amber-bg:#2b2410;
      --focus:#4c8dff;
    }
  }
  :root[data-theme="dark"]{
    --bg:#16181d; --panel:#1e2128; --panel-2:#23262e;
    --ink:#ecece7; --ink-soft:#9a9da4; --hair:#31343d;
    --accent:#e5433d; --accent-ink:#ffffff;
    --amber:#f5b301; --amber-bg:#2b2410;
    --focus:#4c8dff;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:var(--body);font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  a{color:inherit}

  /* ---------- brand bar ---------- */
  .brandbar{
    background:#ffffff;
    border-bottom:1px solid #e4e2d8;
    padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;
  }
  .brandbar-in{
    max-width:680px;margin:0 auto;
    display:flex;align-items:center;gap:12px;
  }
  .brandbar img{width:auto;display:block}
  .logo-mak{height:13px}
  .logo-mate{height:13px}
  .brandbar .sep{width:1px;height:18px;background:#cbc9bd;flex:none}
  .brandbar .tag{
    margin-left:auto;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.1em;text-transform:uppercase;color:#9b9b92;
  }
  @media (max-width:410px){ .brandbar .tag{display:none} }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--hair);
    padding:10px 16px;
  }
  .bar{display:flex;align-items:center;gap:10px;max-width:680px;margin:0 auto}
  .mark{width:26px;height:26px;flex:none;color:var(--amber)}
  .wordmark{
    font-family:var(--sans);font-weight:700;font-size:15px;
    letter-spacing:.14em;text-transform:uppercase;
  }
  .wordmark b{color:var(--accent);font-weight:800}
  .spacer{flex:1}
  .back{
    font-family:var(--mono);font-size:12px;letter-spacing:.04em;
    color:var(--ink-soft);background:none;border:0;cursor:pointer;
    padding:6px 4px;display:none;align-items:center;gap:6px;
  }
  .back svg{width:12px;height:12px}
  body[data-view="brand"] .back{display:inline-flex}

  .search-wrap{max-width:680px;margin:10px auto 0;position:relative}
  input[type="search"]{
    width:100%;font-family:var(--body);font-size:16px;
    color:var(--ink);background:var(--panel);
    border:1px solid var(--hair);border-radius:10px;
    padding:11px 12px 11px 38px;
    appearance:none;-webkit-appearance:none;
  }
  input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none}
  input[type="search"]:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
  .search-wrap svg{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--ink-soft);pointer-events:none;
  }

  main{max-width:680px;margin:0 auto;padding:8px 16px 48px}

  /* ---------- brand index ---------- */
  .index-head{
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-soft);
    padding:16px 2px 8px;
  }
  .brow{
    display:grid;grid-template-columns:minmax(0,1fr) auto;
    align-items:baseline;column-gap:12px;width:100%;
    background:none;border:0;border-top:1px solid var(--hair);
    padding:14px 2px;cursor:pointer;text-align:left;color:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  .brow:first-of-type{border-top:0}
  .brow:active{background:var(--panel-2)}
  .brow:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
  .bname{
    font-family:var(--sans);font-weight:650;font-size:19px;
    letter-spacing:.005em;min-width:0;overflow-wrap:anywhere;
  }
  .bname mark{background:var(--amber-bg);color:var(--ink);border-radius:2px}
  .bmeta{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
  .bhint{
    display:block;font-family:var(--mono);font-size:11.5px;
    color:var(--accent);margin-top:3px;letter-spacing:.02em;
  }
  .empty{
    padding:40px 8px;text-align:center;color:var(--ink-soft);
    font-size:14.5px;
  }

  /* ---------- brand detail ---------- */
  #brand{display:none}
  body[data-view="brand"] #home{display:none}
  body[data-view="brand"] #brand{display:block}

  .b-title{
    font-family:var(--sans);font-weight:800;font-size:30px;
    letter-spacing:.01em;line-height:1.1;margin:18px 0 6px;
  }
  .b-sub{
    font-family:var(--mono);font-size:12px;color:var(--ink-soft);
    display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;
    margin-bottom:4px;
  }
  .modelbadge{
    font-family:var(--mono);font-size:12px;
    background:var(--amber-bg);color:var(--amber);
    border:1px solid var(--amber);border-radius:999px;
    padding:2px 9px;
  }
  .pdf-link{
    display:inline-flex;align-items:center;gap:7px;
    font-family:var(--mono);font-size:12px;letter-spacing:.03em;
    color:var(--ink);text-decoration:none;
    border:1px solid var(--hair);border-radius:8px;
    padding:7px 11px;margin:12px 0 4px;
  }
  .pdf-link svg{width:13px;height:13px;color:var(--accent)}
  .pdf-link:active{background:var(--panel-2)}

  .b-note{
    background:var(--amber-bg);
    border-left:3px solid var(--amber);
    color:var(--ink);
    font-size:13.5px;line-height:1.45;
    padding:10px 12px;border-radius:0 8px 8px 0;
    margin:14px 0 4px;
  }

  .proc{
    background:var(--panel);
    border:1px solid var(--hair);border-radius:12px;
    padding:16px 15px;margin-top:16px;
  }
  .proc.is-target{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
  .proc-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:2px}
  .proc-kind{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  .proc-title{font-family:var(--sans);font-weight:700;font-size:18px}
  .proc-applies{
    font-family:var(--mono);font-size:11.5px;color:var(--amber);
    width:100%;margin-top:1px;
  }
  ol.steps{list-style:none;margin:12px 0 0;padding:0}
  ol.steps li{
    display:grid;grid-template-columns:26px 1fr;gap:10px;
    padding:9px 0;border-top:1px solid var(--hair);
    font-size:14.5px;line-height:1.5;
  }
  ol.steps li:first-child{border-top:0;padding-top:2px}
  ol.steps .n{
    font-family:var(--mono);font-size:12px;color:var(--accent);
    padding-top:2px;font-variant-numeric:tabular-nums;
  }
  .proc-note{
    margin-top:12px;font-size:13px;line-height:1.45;color:var(--ink-soft);
    border-top:1px dashed var(--hair);padding-top:10px;
  }
  .proc-note b{color:var(--ink);font-weight:600}

  /* ---------- models ---------- */
  details.models{margin-top:22px;border-top:1px solid var(--hair);padding-top:12px}
  details.models summary{
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-soft);
    cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
  }
  details.models summary::-webkit-details-marker{display:none}
  details.models summary .chev{transition:transform .15s}
  details.models[open] summary .chev{transform:rotate(90deg)}
  .modelgrid{
    display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;
  }
  .modelgrid span{
    font-family:var(--mono);font-size:12px;color:var(--ink-soft);
    background:var(--panel-2);border-radius:6px;padding:4px 8px;
  }
  .modelgrid span.hit{color:var(--ink);background:var(--amber-bg);box-shadow:inset 0 0 0 1px var(--amber)}

  footer{
    max-width:680px;margin:0 auto;padding:24px 18px 40px;
    font-size:12px;line-height:1.5;color:var(--ink-soft);
    border-top:1px solid var(--hair);
  }

  @media (prefers-reduced-motion:no-preference){
    #brand{animation:fade .18s ease}
    @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  }
  @media (min-width:520px){
    .b-title{font-size:36px}
  }
</style>
</head>

<script>
(function(){
  "use strict";
  var BRANDS = DB.brands;
  var bySlug = {};
  BRANDS.forEach(function(b){ bySlug[b.slug] = b; });

  var norm = function(s){
    return (s||"").toString().toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"");
  };

  var elHome = document.getElementById("home");
  var elBrand = document.getElementById("brand");
  var elQ = document.getElementById("q");
  var elWm = document.getElementById("wm");

  function esc(s){
    return s.replace(/[&<>"]/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function highlight(name, q){
    if(!q) return esc(name);
    var i = norm(name).indexOf(norm(q));
    if(i<0) return esc(name);
    return esc(name.slice(0,i))+"<mark>"+esc(name.slice(i,i+q.length))+"</mark>"+esc(name.slice(i+q.length));
  }

  /* ---------- home / index ---------- */
  function renderHome(){
    var q = elQ.value.trim();
    var nq = norm(q);
    var rows = BRANDS.map(function(b){
      var brandHit = !nq || norm(b.name).indexOf(nq) >= 0;
      var modelHits = nq ? b.models.filter(function(m){ return norm(m).indexOf(nq) >= 0; }) : [];
      if(nq && !brandHit && modelHits.length === 0) return "";
      var hint = "";
      if(nq && !brandHit && modelHits.length){
        hint = '<span class="bhint">modello · ' + esc(modelHits.slice(0,4).join(" · "))
             + (modelHits.length>4 ? " +" + (modelHits.length-4) : "") + '</span>';
      }
      var target = (nq && !brandHit && modelHits.length) ? modelHits[0] : "";
      return '<button class="brow" data-slug="'+b.slug+'"'
        + (target ? ' data-model="'+esc(target)+'"' : '') + '>'
        + '<span class="bname">' + highlight(b.name, brandHit ? q : "") + hint + '</span>'
        + '<span class="bmeta">' + b.procedures.length + ' proc · ' + b.models.length + ' mod</span>'
        + '</button>';
    }).join("");

    elHome.innerHTML = rows.trim()
      ? '<div class="index-head">' + (nq ? "Risultati" : BRANDS.length + " marche") + '</div>' + rows
      : '<p class="empty">Nessuna marca o modello per «' + esc(q) + '».</p>';
  }

  /* ---------- brand detail ---------- */
  function stepList(steps){
    return '<ol class="steps">' + steps.map(function(s,i){
      return '<li><span class="n">' + (i+1) + '</span><span>' + esc(s) + '</span></li>';
    }).join("") + '</ol>';
  }

  function procMatchesModel(p, model){
    if(!model || !p.applies) return false;
    var a = norm(p.applies);
    var m = norm(model);
    if(a.indexOf(m) < 0) return false;
    if(/tranne|esclus/.test(a)) return false; // "tutti tranne X" = X NON e il target
    return true;
  }

  function renderBrand(slug, model){
    var b = bySlug[slug];
    if(!b){ go(""); return; }
    elWm.textContent = "";
    document.title = b.name + " — Apprendimento TPMS";

    var kindOf = function(t){
      if(/OBDII/i.test(t)) return "Via presa diagnosi";
      if(/Copia/i.test(t)) return "Clonazione ID";
      if(/Stazionario/i.test(t)) return "A veicolo fermo";
      return "Guida di apprendimento";
    };

    var anyModelProc = b.procedures.some(function(p){ return procMatchesModel(p, model); });

    var procsHtml = b.procedures.map(function(p){
      var isTarget = model && (anyModelProc ? procMatchesModel(p, model) : false);
      var appliesLabel = p.applies
        ? (/^(tutti|altri|tranne)/i.test(p.applies) ? p.applies : "Solo: " + p.applies)
        : "";
      return '<article class="proc' + (isTarget ? ' is-target' : '') + '">'
        + '<div class="proc-h">'
        +   '<span class="proc-kind">' + esc(kindOf(p.title)) + '</span>'
        +   '<span class="proc-title">' + esc(p.title) + '</span>'
        +   (appliesLabel ? '<span class="proc-applies">' + esc(appliesLabel) + '</span>' : '')
        + '</div>'
        + stepList(p.steps)
        + (p.note ? '<p class="proc-note"><b>Nota.</b> ' + esc(p.note) + '</p>' : '')
        + '</article>';
    }).join("");

    var modelsHtml = b.models.map(function(m){
      var hit = model && norm(m) === norm(model);
      return '<span' + (hit ? ' class="hit"' : '') + '>' + esc(m) + '</span>';
    }).join("");

    elBrand.innerHTML =
        '<h1 class="b-title">' + esc(b.name) + '</h1>'
      + '<div class="b-sub">'
      +   (model ? '<span class="modelbadge">' + esc(model) + '</span>' : '')
      +   '<span>' + b.procedures.length + (b.procedures.length===1 ? ' procedura' : ' procedure')
      +   ' · ' + b.models.length + ' modelli</span>'
      + '</div>'
      + '<a class="pdf-link" href="' + esc(b.pdf) + '" target="_blank" rel="noopener">'
      +   '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 1.5h5L13 5v9.5H4z" stroke="currentColor" stroke-width="1.4"/><path d="M9 1.5V5h4" stroke="currentColor" stroke-width="1.4"/></svg>'
      +   'Scheda PDF ufficiale MATE</a>'
      + (b.note ? '<p class="b-note">' + esc(b.note) + '</p>' : '')
      + (model && !anyModelProc
          ? '<p class="b-note">Per «' + esc(model) + '» valgono le procedure generali qui sotto. Nessuna variante dedicata a questo modello nella scheda.</p>'
          : '')
      + procsHtml
      + '<details class="models"' + (model ? ' open' : '') + '>'
      +   '<summary><svg class="chev" viewBox="0 0 12 12" width="10" height="10" fill="none" aria-hidden="true"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      +   'Modelli coperti (' + b.models.length + ')</summary>'
      +   '<div class="modelgrid">' + modelsHtml + '</div>'
      + '</details>';

    window.scrollTo(0,0);
    var t = elBrand.querySelector(".proc.is-target");
    if(t && window.matchMedia("(prefers-reduced-motion: no-preference)").matches){
      setTimeout(function(){ t.scrollIntoView({behavior:"smooth",block:"center"}); }, 260);
    }
  }

  /* ---------- router ---------- */
  function go(hash){
    if(("#/"+hash) === location.hash || (hash==="" && (location.hash==="#/"||location.hash===""))){
      route();
    } else {
      location.hash = "#/" + hash;
    }
  }

  function route(){
    var raw = location.hash.replace(/^#\/?/,"");
    var parts = raw.split("/");
    var slug = parts[0] || "";
    var model = parts[1] ? decodeURIComponent(parts[1]) : "";
    if(slug && bySlug[slug]){
      document.body.dataset.view = "brand";
      renderBrand(slug, model);
    } else {
      document.body.dataset.view = "home";
      elWm.innerHTML = 'Apprendimento <b>TPMS</b>';
      document.title = "Apprendimento TPMS";
      renderHome();
    }
  }

  /* ---------- events ---------- */
  document.addEventListener("DOMContentLoaded", function(){
    renderHome();
    route();

    elQ.addEventListener("input", function(){
      if(document.body.dataset.view === "brand"){ location.hash = "#/"; }
      renderHome();
    });

    elHome.addEventListener("click", function(e){
      var row = e.target.closest(".brow");
      if(!row) return;
      var slug = row.dataset.slug;
      var model = row.dataset.model;
      location.hash = "#/" + slug + (model ? "/" + encodeURIComponent(model) : "");
    });

    document.getElementById("backBtn").addEventListener("click", function(){
      location.hash = "#/";
      elQ.value = "";
      renderHome();
      elQ.focus();
    });

    window.addEventListener("hashchange", route);
  });
})();
</script>
