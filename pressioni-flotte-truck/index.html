function geom(tipo,assi){const cx=110,W=220,powered=!TRAINATI.includes(tipo),ys=[];
  if(powered){let y=74;assi.forEach((a,i)=>{if(i>0)y+=(assi[i-1].tipo==='sterzante'&&a.tipo!=='sterzante')?128:62;ys.push(y)})}
  else{let y=tipo==='rimorchio'?92:150;assi.forEach((a,i)=>{if(i>0)y+=(tipo==='rimorchio'&&i===1)?140:62;ys.push(y)})}
  const H=(ys.length?ys[ys.length-1]:120)+44;const wheels=[];
  ys.forEach((y,i)=>{const a=assi[i],h=46;
    if(a.gem)[['SE',-94],['SI',-72],['DI',52],['DE',74]].forEach(([s,dx])=>wheels.push({k:(i+1)+s,x:cx+dx,y:y-h/2,w:20,h}));
    else[['S',-86],['D',62]].forEach(([s,dx])=>wheels.push({k:(i+1)+s,x:cx+dx,y:y-h/2,w:24,h}))});
  const body=[];
  if(powered){body.push({t:'r',x:cx-60,y:10,w:120,h:44,rx:10},{t:'r',x:cx-22,y:54,w:44,h:H-64,rx:3})}
  else if(tipo==='semirimorchio'){body.push({t:'r',x:cx-64,y:10,w:128,h:H-20,rx:6},{t:'c',x:cx,y:38,r:6})}

  return {W,H,cx,ys,wheels,body,powered}}
function schemeSVG(tipo,assi,vals,opt){vals=vals||{};opt=opt||{};

    else if(b.t==='c')s+=`<circle cx="${b.x}" cy="${b.y}" r="${b.r}" fill="none" stroke="currentColor" class="ax" style="stroke-width:2"/>`;

  s+=`<text class="lab" x="6" y="14">▲ marcia</text><text class="lab" x="6" y="${g.H-6}">SX</text><text class="lab" x="${g.W-6}" y="${g.H-6}" text-anchor="end">DX</text>`;
  g.ys.forEach((y,i)=>{s+=`<line class="ax" x1="${g.cx-74}" y1="${y}" x2="${g.cx+74}" y2="${y}"/><circle class="axn" cx="${g.cx}" cy="${y}" r="9"/><text class="axt" x="${g.cx}" y="${y+3.5}">${i+1}</text>`});
  g.wheels.forEach(w=>{const v=vals[w.k]||{};const cls=v.s?'w-'+v.s:(v.has?'w-x':'w-e');const dark=!v.s;const cxw=w.x+w.w/2;

  return s+'</svg>'}

    app.innerHTML=`<h1>NUOVA LETTURA</h1><input class="search" id="q" type="search" placeholder="Cerca targa in tutte le flotte" autocapitalize="characters"><div id="res"></div>
    <h2>Scegli la flotta</h2><div class="list">${F.length?F.map(f=>`<a class="li" href="#/nuova?f=${f.id}"><div class="m"><div class="t">${esc(f.nome)}</div><div class="s">${mezziDi(f.id).length} mezzi</div></div><span class="chev">›</span></a>`).join(''):'<div class="empty">Nessuna flotta.</div>'}</div>
    <a class="btn blk" href="#/flotta-edit/nuova?ret=nuova">+ Nuova flotta</a>`;
    $('#q').addEventListener('input',e=>{const t=normTarga(e.target.value);const r=t.length<2?[]:act(S.mezzi).filter(m=>normTarga(m.targa).includes(t)).slice(0,10);
      $('#res').innerHTML=r.length?'<div class="list">'+r.map(m=>`<a class="li" href="#/lettura/nuova?m=${m.id}"><div class="m"><div class="t"><span class="targa">${esc(m.targa)}</span></div><div class="s">${esc((getF(m.flottaId)||{}).nome||'')} · ${esc(TIPI[m.tipo])}</div></div><span class="chev">›</span></a>`).join('')+'</div>':''});return}
  const f=getF(q.f);if(!f)return notFound();const M=mezziDi(f.id).filter(m=>m.attivo!==false);
  const ord=M.map(m=>({m,sc:scadenza(m)})).sort((a,b)=>a.sc.ord-b.sc.ord||a.m.targa.localeCompare(b.m.targa));
  app.innerHTML=`<a class="crumb" href="#/nuova">‹ Flotte</a><h1>${esc(f.nome)}</h1><input class="search" id="q" type="search" placeholder="Filtra targa" autocapitalize="characters">
  <h2>Scegli il mezzo</h2><div class="list" id="ls"></div><a class="btn blk" href="#/mezzo-edit/nuovo?f=${f.id}&ret=lettura">+ Nuovo mezzo</a>`;
  const draw=()=>{const t=normTarga($('#q').value);const r=ord.filter(x=>!t||normTarga(x.m.targa).includes(t));
    $('#ls').innerHTML=r.length?r.map(({m,sc})=>`<a class="li" href="#/lettura/nuova?m=${m.id}"><div class="m"><div class="t"><span class="targa">${esc(m.targa)}</span> <span class="small muted">${esc(TIPI[m.tipo])}</span></div><div class="s"><span class="chip ${sc.s}" style="padding:1px 7px">${esc(sc.lab)}</span></div></div><span class="chev">›</span></a>`).join(''):'<div class="empty">Nessun mezzo.</div>'};
  draw();$('#q').addEventListener('input',draw)};

/* ---------- LETTURA ---------- */
function creaBozza(q){const m=getM(q.m);if(!m)return null;const f=getF(m.flottaId)||{};
  const abId=q.ab||m.abbinatoId||'';const ab=abId&&getM(abId);
  return {id:uid(),sessione:q.s||uid(),data:localNow(),flottaId:m.flottaId,flottaNome:f.nome||'',operatore:q.op||S.meta.lastOp||S.set.operatore||'',
    mezzoId:m.id,targa:m.targa,tipoMezzo:m.tipo,abbinatoId:ab&&!ab.deleted?ab.id:'',abbinatoTarga:ab&&!ab.deleted?ab.targa:'',km:null,luogo:'',condizione:'freddo',
    tpms:m.tpms||'',tpmsStato:'',assi:clone(m.assi||[]),ruote:{},note:''}}
const isSaved=L=>S.letture.some(x=>x.id===L.id);
async function salvaLettura(L){if(!isSaved(L)&&!nRuote(L))return;S.meta.lastOp=L.operatore;setMeta('lastOp',L.operatore);await save('letture',L);
  const m=getM(L.mezzoId);if(m&&!m.deleted){const u=ultima(m.id);if(u&&u.id===L.id){let ch=false;
    if(L.km&&(!m.kmUltimo||L.km>m.kmUltimo)){m.kmUltimo=L.km;ch=true}if(L.tpms&&L.tpms!==m.tpms){m.tpms=L.tpms;ch=true}if(ch)await save('mezzi',m)}}}
VIEWS.lettura=([id],q)=>{
  let L;if(id==='nuova'){L=creaBozza(q);if(!L)return notFound('Mezzo non trovato.');DRAFT=L;history.replaceState(null,'','#/lettura/'+L.id);lastPath='/lettura/'+L.id}
  else L=getL(id)||(DRAFT&&DRAFT.id===id?DRAFT:null);
  if(!L||L.deleted)return notFound('Lettura non trovata (forse non era stata salvata).');
  const m=getM(L.mezzoId)||{};const P=positions(L.assi);
  const fM=act(S.mezzi).filter(x=>x.flottaId===L.flottaId&&x.id!==L.mezzoId&&TRAINATI.includes(x.tipo)!==TRAINATI.includes(L.tipoMezzo));
  const c=esito(L);
  const tbl=P.map(p=>{const r=L.ruote[p.k];const e=c.ev[p.k];const b=battMin(r);
    return `<tr class="tap" data-pos="${p.k}"><td>${posLabel(p.k,true)}</td><td class="n">${r&&r.p!=null?fmt(r.p):'—'}</td><td class="n">${b!=null?fmt(b):'—'}</td><td class="n">${r&&r.t!=null?fmt(r.t,0):'—'}</td><td>${e?chipS(e.s):'<span class="muted small">da leggere</span>'}${r&&r.foto&&r.foto.length?' 📷':''}</td></tr>`}).join('');
  app.innerHTML=`<a class="crumb" href="#/mezzo/${L.mezzoId}">‹ ${esc(L.targa)}</a>
  <div class="row"><h1 class="sp" style="margin-bottom:4px">Lettura <span class="targa" style="font-size:20px">${esc(L.targa)}</span></h1>${chipEsito(c)}</div>
  <p class="small muted" style="margin:0 0 10px">${esc(L.flottaNome)} · ${esc(TIPI[L.tipoMezzo]||'')} · ${c.fatte}/${c.tot} ruote ${isSaved(L)?'· salvata':'· <b>non ancora salvata</b>'}</p>
  <details class="card"${isSaved(L)?'':' open'}><summary>Dati della lettura · ${fmtD(L.data)}</summary>
   <div class="grid2"><label class="f"><span>Data e ora</span><input type="datetime-local" data-h="data" value="${esc(L.data)}"></label>
   <label class="f"><span>Letto da</span><input data-h="operatore" value="${esc(L.operatore)}" placeholder="nome operatore"></label>
   <label class="f"><span>Km</span><input data-h="km" inputmode="numeric" value="${L.km??''}"></label>
   <label class="f"><span>Abbinato a</span><select data-h="abbinatoId"><option value="">Nessuno (mezzo singolo)</option>${fM.map(x=>`<option value="${x.id}"${x.id===L.abbinatoId?' selected':''}>${esc(x.targa)} · ${esc(TIPI[x.tipo])}</option>`).join('')}</select></label></div>
   <label class="f"><span>Condizione pneumatici</span><div class="seg" data-seg="condizione"><button data-v="freddo"${L.condizione==='freddo'?' class="on"':''}>A freddo</button><button data-v="caldo"${L.condizione==='caldo'?' class="on"':''}>A caldo</button></div></label>
   <div class="grid2"><label class="f"><span>TPMS presente</span><select data-h="tpms"><option value="">Non indicato</option><option value="si"${L.tpms==='si'?' selected':''}>Sì</option><option value="no"${L.tpms==='no'?' selected':''}>No</option></select></label>
   <label class="f"><span>Stato TPMS</span><select data-h="tpmsStato"><option value="">Non verificato</option><option value="ok"${L.tpmsStato==='ok'?' selected':''}>Funziona</option><option value="allarme"${L.tpmsStato==='allarme'?' selected':''}>Spia o allarme attivo</option><option value="guasto"${L.tpmsStato==='guasto'?' selected':''}>Guasto / sensori da sostituire</option></select></label></div>
   <label class="f"><span>Luogo</span><input data-h="luogo" value="${esc(L.luogo||'')}" placeholder="es. deposito, piazzale, officina"></label>
   <label class="f"><span>Note generali</span><textarea data-h="note">${esc(L.note||'')}</textarea></label>
  </details>
  ${L.condizione==='caldo'?'<div class="note">Lettura a caldo: le pressioni sono più alte di quelle a freddo, il confronto con il riferimento è indicativo.</div>':''}
  <div class="card">${schemeSVG(L.tipoMezzo,L.assi,valsDaLettura(L))}${LEGENDA}
   <button class="btn red blk" id="seq" style="margin-top:12px">${c.fatte?'Continua in sequenza':'Inizia: tocca una ruota o vai in sequenza'}</button></div>
  <div class="card tblwrap"><table class="t"><thead><tr><th>Ruota</th><th class="n">bar</th><th class="n">mm</th><th class="n">°C</th><th>Esito</th></tr></thead><tbody>${tbl}</tbody></table></div>
  <div class="btns"><button class="btn pri" id="fine">✓ Concludi lettura</button><a class="btn" href="#/report/${L.flottaId}?l=${L.id}" id="pdf">📄 PDF per il cliente</a></div>
  <div class="btns">${isSaved(L)?'<button class="btn dan" id="del">🗑 Elimina lettura</button>':''}${(getM(L.mezzoId)&&JSON.stringify(L.assi)!==JSON.stringify(getM(L.mezzoId).assi))?'<button class="btn" id="sync">Aggiorna assi dal mezzo</button>':''}</div>`;
  const hEv=async e=>{const k=e.target.dataset.h;if(!k)return;let v=e.target.value;
    if(k==='km')v=num(v);if(k==='abbinatoId'){const a=getM(v);L.abbinatoTarga=a?a.targa:''}
    L[k]=v;if(isSaved(L))await salvaLettura(L)};
  on('[data-h]','change',hEv);
  on('[data-seg] button','click',async(e,b)=>{L[b.parentNode.dataset.seg]=b.dataset.v;if(isSaved(L))await salvaLettura(L);render()});
  on('.wh','click',(e,el)=>apriRuota(L,el.dataset.pos));on('tr.tap','click',(e,el)=>apriRuota(L,el.dataset.pos));
  $('#seq').onclick=()=>{const p=P.find(p=>isEmptyR(L.ruote[p.k]))||P[0];if(p)apriRuota(L,p.k)};
  $('#pdf').onclick=async e=>{if(!isSaved(L)){e.preventDefault();if(!nRuote(L))return alert('Inserisci almeno una ruota.');await salvaLettura(L);go('#/report/'+L.flottaId+'?l='+L.id)}};
  $('#fine').onclick=async()=>{if(!nRuote(L)){if(confirm('Nessuna ruota inserita. Uscire senza salvare?'))go('#/mezzo/'+L.mezzoId);return}
    await salvaLettura(L);toast('Lettura salvata');
    if(L.abbinatoId&&getM(L.abbinatoId)&&!act(S.letture).some(x=>x.sessione===L.sessione&&x.mezzoId===L.abbinatoId&&nRuote(x))){
      if(confirm(`Leggere ora anche ${L.abbinatoTarga}?`))return go(`#/lettura/nuova?m=${L.abbinatoId}&s=${L.sessione}&ab=${L.mezzoId}&op=${encodeURIComponent(L.operatore||'')}`)}
    go('#/mezzo/'+L.mezzoId)};
  const del=$('#del');if(del)del.onclick=async()=>{if(await eliminaLettura(L.id))go('#/mezzo/'+L.mezzoId)};
  const sy=$('#sync');if(sy)sy.onclick=async()=>{if(!confirm('Sostituire gli assi di questa lettura con quelli attuali del mezzo? I valori delle ruote con la stessa posizione restano.'))return;
    L.assi=clone(getM(L.mezzoId).assi);const ks=positions(L.assi).map(p=>p.k);Object.keys(L.ruote).forEach(k=>{if(!ks.includes(k))delete L.ruote[k]});if(isSaved(L))await salvaLettura(L);render()}};

function compressImg(file,max=1280,q=.72){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=e=>{URL.revokeObjectURL(url);rej(e)};img.src=url})}
function sheet(html){closeSheet();const bg=document.createElement('div');bg.className='sheet-bg';bg.innerHTML=`<div class="sheet">${html}</div>`;
  bg.addEventListener('click',e=>{if(e.target===bg)closeSheet()});document.body.appendChild(bg);document.body.style.overflow='hidden';return bg.firstChild}
function closeSheet(){$$('.sheet-bg').forEach(x=>x.remove());document.body.style.overflow=''}
function vediFoto(src){const sh=sheet(`<img src="${src}" style="width:100%;border-radius:10px"><button class="btn blk" style="margin-top:10px" id="cl">Chiudi</button>`);$('#cl',sh).onclick=closeSheet}

function apriRuota(L,pos){const P=positions(L.assi);const p=P.find(x=>x.k===pos);if(!p)return;const a=L.assi[p.ax]||{};
  const r=clone(L.ruote[pos]||{});r.foto=r.foto||[];let mode=(r.bE!=null||r.bC!=null||r.bI!=null)?3:1;
  const th=sogliaB(a,S.set);const nv=v=>v!=null?fmt(v):'';
  const opt=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${k}"${k===(v||'')?' selected':''}>${esc(l)}</option>`).join('');
  const sh=sheet(`<div class="row"><div class="sp"><h3>${posLabel(pos)}</h3><div class="small muted">${esc(a.mis||'misura non indicata')} · ${esc(TIPI_ASSE[a.tipo]||'')}${a.gem?' gemellato':''} · riferimento <b>${a.pt?fmt(a.pt)+' bar':'non impostato'}</b></div></div><button class="btn sm" id="x">✕</button></div>
  <div class="small muted" style="margin:4px 0 8px">${P.indexOf(p)+1} di ${P.length}</div>
  <label class="f big"><span>Pressione (bar)</span><input id="wp" inputmode="decimal" value="${nv(r.p)}" placeholder="${a.pt?fmt(a.pt):'0,0'}" autocomplete="off"></label>
  <label class="f"><span>Battistrada (mm) · giallo ≤ ${fmt(th.g)} · rosso ≤ ${fmt(th.r)}</span><div class="seg" id="bm"><button data-m="1"${mode===1?' class="on"':''}>Un valore</button><button data-m="3"${mode===3?' class="on"':''}>3 punti</button></div></label>
  <div id="b1" class="${mode===1?'':'hide'}" style="${mode===1?'':'display:none'}"><label class="f"><input id="wb" inputmode="decimal" value="${nv(r.b)}" placeholder="mm"></label></div>
  <div id="b3" style="${mode===3?'':'display:none'}" class="grid3"><label class="f"><span>Esterno</span><input id="wbE" inputmode="decimal" value="${nv(r.bE)}"></label><label class="f"><span>Centro</span><input id="wbC" inputmode="decimal" value="${nv(r.bC)}"></label><label class="f"><span>Interno</span><input id="wbI" inputmode="decimal" value="${nv(r.bI)}"></label></div>
  <div id="prv" style="margin:2px 0 10px"></div>
  <details${(r.t!=null||r.anom||r.az||r.note||r.foto.length||r.pd!=null)?' open':''}><summary class="small" style="font-weight:700;margin-bottom:8px;cursor:pointer">Temperatura, anomalie, intervento, foto</summary>
   <div class="grid2"><label class="f"><span>Temperatura (°C)</span><input id="wt" inputmode="decimal" value="${r.t!=null?fmt(r.t,0):''}"></label>
   <label class="f"><span>Pressione dopo intervento</span><input id="wpd" inputmode="decimal" value="${nv(r.pd)}" placeholder="bar"></label></div>
   <label class="f"><span>Anomalia</span><select id="wan">${opt(ANOM,r.anom)}</select></label>
   <label class="f"><span>Intervento</span><select id="waz">${opt(AZ,r.az)}</select></label>
   <label class="f"><span>Note</span><input id="wno" value="${esc(r.note||'')}"></label>
   <label class="btn blk" style="margin-bottom:6px">📷 Aggiungi foto<input type="file" accept="image/*" id="wf" multiple style="display:none"></label>
   <div class="thumbs" id="th"></div></details>
  <div class="btns"><button class="btn" id="cl">Svuota</button><button class="btn pri" id="ok">Salva</button><button class="btn red" id="nx">Salva e avanti ›</button></div>
  <a class="small muted" href="#/ruota/${L.mezzoId}/${pos}">Storico e consumo di questa ruota ›</a>`);
  const read=()=>{const o={p:num($('#wp',sh).value),t:num($('#wt',sh).value),pd:num($('#wpd',sh).value),anom:$('#wan',sh).value,az:$('#waz',sh).value,note:$('#wno',sh).value.trim(),foto:r.foto};
    if(mode===1)o.b=num($('#wb',sh).value);else{o.bE=num($('#wbE',sh).value);o.bC=num($('#wbC',sh).value);o.bI=num($('#wbI',sh).value)}
    Object.keys(o).forEach(k=>{if(o[k]==null||o[k]===''||(k==='foto'&&!o[k].length))delete o[k]});return o};
  const prv=()=>{const o=read();let coppia=null;if(p.io){const alt=L.ruote[pos.slice(0,-1)+(p.io==='E'?'I':'E')];if(alt&&alt.p!=null)coppia=alt.p}
    const e=valutaRuota(o,a,S.set,coppia);$('#prv',sh).innerHTML=e.s?chipS(e.s)+(e.motivi.length?' <span class="small">'+esc(e.motivi.join(' · '))+'</span>':''):''};
  const drawTh=()=>{$('#th',sh).innerHTML=r.foto.map((f,i)=>`<div class="th"><img src="${f}" data-i="${i}"><button class="x" data-d="${i}">×</button></div>`).join('')};
  drawTh();prv();sh.addEventListener('input',prv);sh.addEventListener('change',prv);
  $('#th',sh).addEventListener('click',e=>{if(e.target.dataset.d!=null){r.foto.splice(+e.target.dataset.d,1);drawTh()}else if(e.target.dataset.i!=null)vediFoto(r.foto[+e.target.dataset.i])});
  $('#wf',sh).onchange=async e=>{for(const f of e.target.files){try{r.foto.push(await compressImg(f))}catch(err){alert('Foto non leggibile')}}e.target.value='';drawTh()};
  $('#bm',sh).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=+b.dataset.m;
    $$('#bm button',sh).forEach(x=>x.classList.toggle('on',x===b));$('#b1',sh).style.display=mode===1?'':'none';$('#b3',sh).style.display=mode===3?'':'none';prv()});
  $('#x',sh).onclick=closeSheet;
  const commit=async()=>{const o=read();if(isEmptyR(o))delete L.ruote[pos];else L.ruote[pos]=o;await salvaLettura(L)};
  $('#ok',sh).onclick=async()=>{await commit();closeSheet();render()};
  $('#cl',sh).onclick=async()=>{if(!confirm('Svuotare i valori di questa ruota?'))return;delete L.ruote[pos];await salvaLettura(L);closeSheet();render()};
  $('#nx',sh).onclick=async()=>{await commit();const i=P.indexOf(p);closeSheet();render();if(i<P.length-1)apriRuota(L,P[i+1].k);else toast('Ultima ruota: lettura completa')};
  if(!isIOS)setTimeout(()=>$('#wp',sh).focus(),50)}

/* ---------- RUOTA: storico e consumo ---------- */
function ticks(min,max,n){const span=max-min||1;const raw=span/n;const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>span/x<=n)||mag*10;const out=[];for(let v=Math.ceil(min/st)*st;v<=max+1e-9;v+=st)out.push(+v.toFixed(6));return out}
function lineChart(o){const W=340,H=210,Lm=36,Rm=10,Tm=10,Bm=26;const pts=o.pts;if(!pts.length)return '<div class="empty">Nessun dato.</div>';
  let xs=pts.map(p=>p.x);if(o.proj)xs=xs.concat(o.proj.map(p=>p.x));let x0=Math.min(...xs),x1=Math.max(...xs);
  if(x1===x0){const pad=o.xType==='km'?1000:15;x0-=pad;x1+=pad}else{const pad=(x1-x0)*.04;x0-=pad;x1+=pad}
  const y0=o.yMin,y1=o.yMax;const sx=x=>Lm+(x-x0)/(x1-x0)*(W-Lm-Rm),sy=y=>Tm+(1-(y-y0)/(y1-y0))*(H-Tm-Bm);
  const cl=y=>Math.max(y0,Math.min(y1,y));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'grafico')}">`;
  (o.bands||[]).forEach(b=>{const a=cl(b.a),c=cl(b.b);if(c<=a)return;s+=`<rect class="b-${b.c}" x="${Lm}" y="${sy(c)}" width="${W-Lm-Rm}" height="${sy(a)-sy(c)}"/>`});
  ticks(y0,y1,5).forEach(t=>{s+=`<line class="ch-grid" x1="${Lm}" x2="${W-Rm}" y1="${sy(t)}" y2="${sy(t)}"/><text class="ch-ax" x="${Lm-5}" y="${sy(t)+3.5}" text-anchor="end">${fmt(t,t%1?1:0)}</text>`});
  const xt=o.xType==='km'?ticks(x0,x1,3).filter(t=>t>=x0&&t<=x1):[x0+(x1-x0)*.06,(x0+x1)/2,x1-(x1-x0)*.06];
  xt.forEach((t,i)=>{const lab=o.xType==='km'?fmtK(t):fmtDs(dayStr(Math.round(t)));s+=`<text class="ch-ax" x="${sx(t)}" y="${H-8}" text-anchor="${o.xType==='km'?'middle':i===0?'start':i===2?'end':'middle'}">${lab}</text>`});
  (o.refs||[]).forEach(r=>{if(r.y<y0||r.y>y1)return;s+=`<line class="ch-ref" x1="${Lm}" x2="${W-Rm}" y1="${sy(r.y)}" y2="${sy(r.y)}"/><text class="ch-ax" x="${W-Rm-2}" y="${sy(r.y)-4}" text-anchor="end">${esc(r.lab)}</text>`});
  if(o.proj)s+=`<path class="ch-proj" d="M${o.proj.map(p=>sx(p.x)+','+sy(cl(p.y))).join(' L')}"/>`;
  s+=`<path class="ch-line" d="M${pts.map(p=>sx(p.x)+','+sy(cl(p.y))).join(' L')}"/>`;
  pts.forEach((p,i)=>{s+=`<circle class="ch-mk f-${p.s||'n'}" data-mk="${i}" cx="${sx(p.x)}" cy="${sy(cl(p.y))}" r="5"/>`});
  pts.forEach((p,i)=>{s+=`<circle data-tip="${esc(p.tip)}" data-i="${i}" cx="${sx(p.x)}" cy="${sy(cl(p.y))}" r="15" fill="transparent" style="cursor:pointer"/>`});
  return `<div class="chartbox"><div class="small" style="font-weight:700;margin:0 4px 4px">${esc(o.title)}</div>${s}</svg><div class="tip">${esc(o.hint||'Tocca un punto per il dettaglio')}</div></div>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tip]');if(!t)return;const box=t.closest('.chartbox');if(!box)return;
  box.querySelector('.tip').textContent=t.dataset.tip;$$('.ch-mk',box).forEach(x=>x.classList.toggle('hl',x.dataset.mk===t.dataset.i))});
function regress(pts){const n=pts.length;if(n<2)return null;const mx=pts.reduce((s,p)=>s+p.x,0)/n,my=pts.reduce((s,p)=>s+p.y,0)/n;

  <div class="note info small">🔒 I dati sono salvati <b>solo su questo dispositivo</b> e non su un server: se il telefono si guasta, si perde o si cancellano i dati del browser, senza un backup non sono recuperabili. Per passarli a un altro telefono o a un collega: <b>Esporta</b> qui, invia il file (AirDrop, WhatsApp, email), poi sull'altro dispositivo <b>Importa</b>. L'import <b>unisce</b>: le letture già presenti restano, quelle nuove si aggiungono, una lettura modificata vince la versione più recente. Flotte con lo stesso nome e mezzi con la stessa targa vengono riconosciuti e uniti.</div>
  <div class="kpis"><div class="kpi"><b>${nl}</b><span>Letture</span></div><div class="kpi"><b>${nf}</b><span>Foto</span></div><div class="kpi"><b id="sz">…</b><span>Spazio usato</span></div></div>
  <h2>Esporta</h2><div class="card"><p class="small muted" style="margin-top:0">Ultimo backup completo: <b>${S.meta.lastBackup?fmtDs(S.meta.lastBackup):'mai'}</b></p>
  <label class="ck"><input type="checkbox" id="e_foto" checked> Includi le foto (file più pesante)</label>
  <label class="f"><span>Cosa esportare</span><select id="e_f"><option value="">Tutto (backup completo)</option>${flotteAtt().map(f=>`<option value="${f.id}">Solo ${esc(f.nome)}</option>`).join('')}</select></label>
  <button class="btn pri blk" id="e_json">⇪ Esporta file dati (.json)</button>
  <div class="btns"><button class="btn" id="e_csvl">Letture in Excel (.csv)</button><button class="btn" id="e_csvm">Mezzi in Excel (.csv)</button></div>
  <p class="small muted" style="margin:0">Il file .json serve per backup e import. I .csv si aprono con Excel per le analisi.</p></div>
  <h2>Importa</h2><div class="card"><label class="btn blk">⇩ Scegli un file .json<input type="file" id="i_file" style="display:none"></label><div id="i_prev"></div></div>
  <h2>Prova</h2><div class="card"><p class="small muted" style="margin-top:0">Crea una flotta di esempio con 3 mezzi e 4 letture per vedere schemi, grafici e PDF. Si elimina come una flotta normale.</p><button class="btn blk" id="demo">Carica dati di esempio</button></div>
  <h2>Cestino</h2><div class="list" id="trash"></div>
  <p class="foot"><a href="#/info">Dati e responsabilità</a></p>
  <h2>Zona pericolosa</h2><div class="card"><button class="btn dan blk" id="wipe">Cancella tutti i dati da questo dispositivo</button></div>`;
  if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{$('#sz').textContent=e.usage>1048576?fmt(e.usage/1048576)+' MB':Math.round(e.usage/1024)+' KB'}).catch(()=>{$('#sz').textContent='—'});else $('#sz').textContent='—';
  const drawTrash=()=>{const c=cestino();$('#trash').innerHTML=c.length?c.slice(0,60).map(x=>`<div class="li"><div class="m"><div class="t">${esc(x.lab)}</div><div class="s">${esc(x.sub)}${x.t?' · eliminato il '+fmtD(isoLocal(x.t)):''}</div></div><button class="btn sm" data-rs="${x.st}|${x.id}">↺ Ripristina</button></div>`).join(''):'<div class="empty">Il cestino è vuoto.</div>';
    on('[data-rs]','click',async(e,b)=>{const [st,id]=b.dataset.rs.split('|');await ripristina(st,id);drawTrash()},$('#trash'))};drawTrash();
  $('#e_json').onclick=()=>esportaJSON({flottaId:$('#e_f').value||null,foto:$('#e_foto').checked});
  $('#e_csvl').onclick=()=>esportaCSV('letture');$('#e_csvm').onclick=()=>esportaCSV('mezzi');
  $('#i_file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;let data;
    try{data=JSON.parse(await file.text())}catch(err){return alert('Il file non è un file dati valido.')}
    if(data.formato!==FORMATO)return alert('Il file non è un export di PRESSIONI FLOTTE TRUCK.');
    const nl2=(data.letture||[]).filter(l=>!getL(l.id)).length;
    $('#i_prev').innerHTML=`<p class="small">File di <b>${esc(data.dispositivo||'?')}</b>${data.gommista?' ('+esc(data.gommista)+')':''}, esportato il ${fmtD((data.esportato||'').slice(0,16))}.<br>
      ${(data.flotte||[]).length} flotte · ${(data.mezzi||[]).length} mezzi · ${(data.letture||[]).length} letture, di cui <b>${nl2} nuove</b> per questo dispositivo.</p>
      <label class="ck"><input type="checkbox" id="i_imp"> Usa anche le soglie e le impostazioni del file</label><button class="btn red blk" id="i_go">Unisci i dati</button>`;
    $('#i_go').onclick=async()=>{const R=await importa(data,$('#i_imp').checked);const t=k=>`${R[k].n} nuove, ${R[k].a} aggiornate, ${R[k].i} unite per nome/targa, ${R[k].u} già presenti`;
      $('#i_prev').innerHTML=`<div class="note info small"><b>Import completato.</b><br>Flotte: ${t('flotte')}<br>Mezzi: ${t('mezzi')}<br>Letture: ${t('letture')}</div>`;toast('Dati uniti')}};
  $('#demo').onclick=async()=>{await caricaDemo();toast('Esempio caricato');go('#/flotte')};
  $('#wipe').onclick=async()=>{const t=prompt('Tutte le flotte, i mezzi e le letture di questo dispositivo verranno cancellati. Fai prima un backup.\nPer confermare scrivi ELIMINA');
    if(t!=='ELIMINA')return;for(const s of ['flotte','mezzi','letture'])await DB.clear(s);S.flotte=[];S.mezzi=[];S.letture=[];toast('Dati cancellati');go('#/home')}};
async function caricaDemo(){const f={id:uid(),nome:'Trasporti Esempio (demo)',referente:'Ufficio flotta',citta:'Napoli',freq:30,note:'Dati inventati per provare l\'app.'};
  const ax=(t,g,mis,pt,marca)=>({...asse(t,g),mis,pt,marcaP:marca||''});
  const tr={id:uid(),flottaId:f.id,targa:'EX123AA',tipo:'trattore',marca:'Esempio',modello:'Trattore 4x2',assi:[ax('sterzante',0,'315/70 R22.5',9),ax('trattivo',1,'315/70 R22.5',8.5)],tpms:'no',attivo:true};
  const se={id:uid(),flottaId:f.id,targa:'XA456BB',tipo:'semirimorchio',marca:'Esempio',modello:'Centinato 3 assi',assi:[ax('portante',0,'385/65 R22.5',9),ax('portante',0,'385/65 R22.5',9),ax('portante',0,'385/65 R22.5',9)],tpms:'si',tpmsTipo:'sensori a valvola',attivo:true};
  const mo={id:uid(),flottaId:f.id,targa:'EX789CC',tipo:'motrice',marca:'Esempio',modello:'Motrice 6x2',assi:[ax('sterzante',0,'315/80 R22.5',8.5),ax('trattivo',1,'315/80 R22.5',8),ax('sollevabile',0,'315/80 R22.5',8)],tpms:'',attivo:true};
  tr.abbinatoId=se.id;se.abbinatoId=tr.id;await save('flotte',f);await saveMany('mezzi',[tr,se,mo]);
  const base=dayNum(today());const Ls=[];const op='Operatore demo';
  [120,90,60,25].forEach((ago,j)=>{const ses=uid();const d=dayStr(base-ago)+'T09:30';const km=210000+j*14000;
    [[tr,se],[se,tr]].forEach(([m,ab])=>{const ru={};positions(m.assi).forEach((p,i)=>{const a=m.assi[p.ax];const wear=(a.tipo==='trattivo'?1.15:a.tipo==='sterzante'?.8:.6)*j+(i%3)*.2;
        const r={p:Math.round((a.pt-(j===3&&p.k==='2SI'?1.4:(i%4)*.15))*10)/10};
        if(a.tipo==='sterzante'&&j>=2){r.bE=Math.round((14-wear-1.6)*10)/10;r.bC=Math.round((14-wear)*10)/10;r.bI=Math.round((14-wear-.3)*10)/10}else r.b=Math.round((15-wear-(a.tipo==='trattivo'?3:0))*10)/10;
        if(j===3&&p.k==='2SI'){r.anom='valvola';r.az='gonfiato';r.pd=8.5}ru[p.k]=r});
      Ls.push({id:uid(),sessione:ses,data:d,flottaId:f.id,flottaNome:f.nome,operatore:op,mezzoId:m.id,targa:m.targa,tipoMezzo:m.tipo,abbinatoId:ab.id,abbinatoTarga:ab.targa,km:m===tr?km:null,luogo:'Deposito',condizione:'freddo',tpms:m.tpms,tpmsStato:m.tpms==='si'?'ok':'',assi:clone(m.assi),ruote:ru,note:''})})});
  await saveMany('letture',Ls)}

/* ---------- IMPOSTAZIONI ---------- */
VIEWS.impostazioni=()=>{const s=S.set;const f=(k,l,t='text',ex='')=>`<label class="f"><span>${l}</span><input id="s_${k}" type="${t}" value="${s[k]!=null?esc(typeof s[k]==='number'?fmt(s[k],s[k]%1?1:0):s[k]):''}" ${ex}></label>`;const dec='inputmode="decimal"';
  app.innerHTML=`<h1>Impostazioni</h1>
  <h2>Officina</h2><div class="card">${f('gommista','Nome officina (in testa al PDF)')}${f('gommistaInfo','Indirizzo e telefono (in testa al PDF)')}
  <div class="grid2">${f('operatore','Operatore predefinito')}${f('nomeDispositivo','Nome di questo dispositivo','text','placeholder="es. iPhone Marco"')}</div></div>
  <h2>Controlli periodici</h2><div class="card"><div class="grid2">${f('freq','Controllo ogni (giorni)','text','inputmode="numeric"')}${f('preavviso','Avviso prima della scadenza (giorni)','text','inputmode="numeric"')}</div></div>
  <h2>Soglie della pressione</h2><div class="card"><p class="small muted" style="margin-top:0">Scostamento dalla pressione di riferimento impostata su ogni asse.</p>
  <div class="grid3">${f('pressGiallo','Giallo oltre (± %)','text',dec)}${f('pressRosso','Rosso oltre (± %)','text',dec)}${f('gemelleMax','Diff. max gemelle (bar)','text',dec)}</div></div>
  <h2>Soglie del battistrada</h2><div class="card"><p class="small muted" style="margin-top:0">Valori generali: su ogni asse del mezzo puoi metterne di specifici.</p>
  <div class="grid3">${f('battNuovo','Nuovo (mm)','text',dec)}${f('battGiallo','Giallo sotto (mm)','text',dec)}${f('battRosso','Rosso sotto (mm)','text',dec)}</div>
  ${f('irrMm','Usura irregolare: differenza tra i 3 punti oltre (mm)','text',dec)}</div>
  <h2>Soglie della temperatura</h2><div class="card"><p class="small muted" style="margin-top:0">Vuoto = la temperatura si registra ma non viene valutata.</p><div class="grid2">${f('tempGiallo','Giallo da (°C)','text',dec)}${f('tempRosso','Rosso da (°C)','text',dec)}</div></div>
  <h2>PDF</h2><div class="card"><label class="ck"><input type="checkbox" id="s_suggerimenti"${s.suggerimenti?' checked':''}> Consigli inclusi di base nel PDF</label></div>
  <div class="note small">I valori di partenza delle soglie sono indicativi: impostali secondo le indicazioni dei costruttori dei pneumatici e le regole dell'officina.</div>
  <button class="btn pri blk" id="sv">Salva impostazioni</button>
  <p class="small muted" style="text-align:center;margin-top:18px">PRESSIONI FLOTTE TRUCK · MATE by TRK · versione ${APP_VER}<br>Dati salvati solo su questo dispositivo · <a href="#/info">Dati e responsabilità</a></p>`;
  $('#sv').onclick=async()=>{const n=S.set;['gommista','gommistaInfo','operatore','nomeDispositivo'].forEach(k=>n[k]=$('#s_'+k).value.trim());
    ['freq','preavviso','pressGiallo','pressRosso','gemelleMax','battNuovo','battGiallo','battRosso','irrMm'].forEach(k=>{const v=num($('#s_'+k).value);n[k]=v!=null?v:DEF[k]});
    ['tempGiallo','tempRosso'].forEach(k=>n[k]=num($('#s_'+k).value));n.suggerimenti=$('#s_suggerimenti').checked;
    if(n.pressRosso<=n.pressGiallo)return alert('La soglia rossa della pressione deve essere più alta della gialla.');
    if(n.battRosso>=n.battGiallo)return alert('Il rosso del battistrada deve essere più basso del giallo.');
    if(n.battGiallo>=n.battNuovo)return alert('Il giallo del battistrada deve essere più basso del nuovo.');
    await setMeta('settings',n);toast('Impostazioni salvate')}};

/* ---------- avvio ---------- */
load().then(()=>{render();const a=S.meta.avvisoOk;if(!a||a.ver!==AVVISO_VER)mostraAvviso()}).catch(e=>{app.innerHTML=`<div class="card">Impossibile aprire l'archivio del dispositivo: ${esc(e&&e.message||e)}.<br>Su iPhone non usare la navigazione privata.</div>`});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
