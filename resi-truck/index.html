/* =================== ARCHIVIO SUL DISPOSITIVO (IndexedDB, foto, video e PDF compresi) =================== */
const DB = (() => {
  let p = null, mem = new Map(), ko = false;
  function open(){
    if(p) return p;
    p = new Promise((res, rej) => {
      try{
        const r = indexedDB.open('trk-resi', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('pratiche', {keyPath:'id'});
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      }catch(e){ rej(e); }
    }).catch(() => { ko = true; return null; });
    return p;
  }
  async function tx(mode, fn){
    const d = await open();
    if(!d) return fn(null);
    return new Promise((res, rej) => {
      const t = d.transaction('pratiche', mode), s = t.objectStore('pratiche'); let r;
      try{ r = fn(s); }catch(e){ rej(e); return; }
      t.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  return {
    get memoria(){ return ko; },
    all: () => tx('readonly', s => s ? s.getAll() : {result:[...mem.values()]}),
    put: o => tx('readwrite', s => { if(s) return s.put(o); mem.set(o.id, o); return null; }),
    del: id => tx('readwrite', s => { if(s) return s.delete(id); mem.delete(id); return null; })
  };
})();

/* =================== FOTO E VIDEO =================== */
async function comprimi(file){
  if(!file.type.startsWith('image/') || file.type === 'image/gif') return file;
  try{
    const bmp = await createImageBitmap(file);
    const max = 2200; let {width:w, height:h} = bmp;
    if(Math.max(w,h) <= max && file.size < 1.6e6){ bmp.close && bmp.close(); return file; }
    const k = Math.min(1, max/Math.max(w,h)); w = Math.round(w*k); h = Math.round(h*k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(bmp, 0, 0, w, h); bmp.close && bmp.close();
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
    return b && b.size < file.size ? new File([b], (file.name||'foto').replace(/\.\w+$/,'')+'.jpg', {type:'image/jpeg'}) : file;
  }catch(e){ return file; }
}
async function aggiungiFile(list, files){
  busy(true, 'Preparo i file…');
  try{
    for(const f of files){
      const c = await comprimi(f);
      list.push({id: uid(), nome: c.name || 'file', tipo: c.type || 'application/octet-stream', blob: c, size: c.size});
    }
    await salva(true);
  } finally { busy(false); }
}
function estensione(f){
  const n = (f.nome||'').match(/\.(\w{2,5})$/); if(n) return n[1].toLowerCase();
  if(f.tipo.includes('jpeg')) return 'jpg'; if(f.tipo.includes('png')) return 'png'; if(f.tipo.includes('pdf')) return 'pdf';
  if(f.tipo.includes('quicktime')) return 'mov'; if(f.tipo.includes('mp4')) return 'mp4'; if(f.tipo.includes('heic')) return 'heic';
  return 'bin';
}
const isImg = f => f.tipo.startsWith('image/'), isVid = f => f.tipo.startsWith('video/');
function nomeFileVideo(p, r, i){ const R = p.ruote[r]; return `ALLEGATO3_RUOTA${r+1}_VIDEO${R.a3.length>1?'_'+(i+1):''}.${estensione(R.a3[i])}`; }
// File che non entrano nel PDF e partono insieme: video e DDT in PDF
function fileAParte(p){
  const out = [];
  p.ddt.forEach((f,i) => { if(!isImg(f)) out.push(new File([f.blob], `ALLEGATO1_DDT${p.ddt.length>1?'_'+(i+1):''}.${estensione(f)}`, {type:f.tipo})); });
  for(let r=0;r<p.qta;r++){
    const R = p.ruote[r];
    R.a3.forEach((f,i) => { if(!isImg(f) && !f.url) out.push(new File([f.blob], nomeFileVideo(p,r,i), {type:f.tipo})); });
    R.extra.forEach((f,i) => { if(!isImg(f) && !f.url) out.push(new File([f.blob], `EXTRA_RUOTA${r+1}_${i+1}.${estensione(f)}`, {type:f.tipo})); });
  }
  return out;
}

let logoData = null;
async function caricaLogo(){
  if(logoData) return logoData;
  try{ const b = await (await fetch('logo-trk.png')).blob(); logoData = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); }catch(e){ logoData = null; }
  return logoData;
}
async function immagine(blob, max=1500){
  try{
    const bmp = await createImageBitmap(blob);
    const k = Math.min(1, max/Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
    return {data: c.toDataURL('image/jpeg', 0.8), w: c.width, h: c.height};
  }catch(e){ return null; }
}
function fotogramma(blob){
  return new Promise(res => {
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.setAttribute('playsinline',''); v.preload = 'auto';
    const u = URL.createObjectURL(blob); let fatto = false;
    const fine = r => { if(fatto) return; fatto = true; try{ v.pause(); }catch(e){} URL.revokeObjectURL(u); res(r); };
    setTimeout(() => fine(null), 7000);
    v.onloadeddata = () => { try{ v.currentTime = Math.min(0.8, (v.duration || 2) / 2); }catch(e){ fine(null); } };
    v.onseeked = () => {
      try{
        if(!v.videoWidth) return fine(null);
        const k = Math.min(1, 1400/Math.max(v.videoWidth, v.videoHeight));
        const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth*k); c.height = Math.round(v.videoHeight*k);
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        fine({data: c.toDataURL('image/jpeg', 0.8), w: c.width, h: c.height});
      }catch(e){ fine(null); }
    };
    v.onerror = () => fine(null);
    v.src = u; v.load();
    const pl = v.play(); if(pl && pl.then) pl.then(() => v.pause()).catch(() => {});
  });
}
const pulisci = s => String(s ?? '').replace(/[–—]/g,'-').replace(/[’‘]/g,"'").replace(/[“”″]/g,'"').replace(/…/g,'...').replace(/×/g,'x').replace(/[^\x20-\x7E\xA0-\xFF\n]/g,'');
function nomePdf(p){ return ('Reso TRK ' + p.num + ' ' + (p.cliente.rs||'')).replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim().slice(0,80) + '.pdf'; }

async function creaPDF(p, avanzamento){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4', compress:true});
  const W = 210, H = 297, M = 14, CW = W - 2*M, BASSO = H - 16;
  const C = {ink:[24,24,24], muted:[105,105,105], line:[214,214,210], soft:[244,244,242], red:[215,25,32], blue:[29,99,201], dark:[34,34,34], ok:[31,138,76], white:[255,255,255]};
  const fill = c => doc.setFillColor(...c), draw = c => doc.setDrawColor(...c), col = c => doc.setTextColor(...c);
  const font = (st, sz) => { doc.setFont('helvetica', st); doc.setFontSize(sz); };
  const T = s => pulisci(s);
  const mo = MOTIVI[p.motivo];
  const logo = await caricaLogo();
  const ag = p.autore && p.autore.ruolo === 'agente';

  function spunta(x, y, ok){
    doc.setLineWidth(0.7);
    if(ok){ draw(C.ok); doc.line(x, y, x+1.6, y+1.7); doc.line(x+1.6, y+1.7, x+4.4, y-1.8); }
    else { draw(C.red); doc.line(x, y-1.6, x+3.2, y+1.6); doc.line(x+3.2, y-1.6, x, y+1.6); }
    doc.setLineWidth(0.2);
  }
  // Riquadro con titolo e righe etichetta/valore; ritorna l'altezza
  function misuraBox(rows, w){
    font('bold', 10); let h = 10;
    rows.forEach(([l, v]) => { const n = doc.splitTextToSize(T(v || '-'), w - 8).length; h += 3.6 + n*4.4 + 2.2; });
    return h + 1.5;
  }
  function box(x, y, w, h, titolo, rows){
    fill(C.white); draw(C.line); doc.setLineWidth(0.25); doc.roundedRect(x, y, w, h, 2, 2, 'FD');
    fill(C.soft); doc.roundedRect(x, y, w, 8, 2, 2, 'F'); doc.rect(x, y+5, w, 3, 'F');
    draw(C.line); doc.line(x, y+8, x+w, y+8);
    font('bold', 8); col(C.muted); doc.text(T(titolo).toUpperCase(), x+4, y+5.4);
    let yy = y + 13;
    rows.forEach(([l, v]) => {
      font('normal', 7.5); col(C.muted); doc.text(T(l), x+4, yy);
      font('bold', 10); col(C.ink); const ln = doc.splitTextToSize(T(v || '-'), w - 8); doc.text(ln, x+4, yy + 4.4);
      yy += 3.6 + ln.length*4.4 + 2.2;
    });
  }
  function coppia(y, a, b){
    const w = (CW - 6)/2, h = Math.max(misuraBox(a.rows, w), misuraBox(b.rows, w));
    box(M, y, w, h, a.t, a.rows); box(M + w + 6, y, w, h, b.t, b.rows);
    return y + h + 6;
  }
  function testataAllegati(){
    if(logo) doc.addImage(logo, 'PNG', M, 9, 30, 30*167/700);
    font('bold', 9); col(C.ink); doc.text('RESO PER CONTESTAZIONE - RUOTE TRUCK', W-M, 12, {align:'right'});
    font('normal', 8.5); col(C.muted); doc.text(T(`Pratica ${p.num} · ${p.cliente.rs}`), W-M, 16.5, {align:'right'});
    fill(C.red); doc.rect(M, 20.5, CW, 0.8, 'F');
    return 27;
  }
  function fascia(y, testo, destra, colore){
    fill(colore); doc.roundedRect(M, y, CW, 10, 2, 2, 'F');
    font('bold', 11); col(C.white); doc.text(T(testo), M+4, y+6.7);
    if(destra){ font('normal', 9.5); doc.text(T(destra), W-M-4, y+6.7, {align:'right'}); }
    return y + 15;
  }
  // Un elemento immagine: didascalia con etichetta colorata + immagine adattata nel riquadro
  function tasto(x, y, w, testo, url, colore){
    fill(colore); doc.roundedRect(x, y, w, 9, 2, 2, 'F');
    font('bold', 9.5); col(C.white); doc.text(testo, x + w/2, y + 6, {align:'center'});
    doc.link(x, y, w, 9, {url});
  }
  function elemento(x, y, w, h, tag, tagCol, didascalia, img, nota, video, url){
    font('bold', 7.5); const tw = doc.getTextWidth(tag) + 5;
    fill(tagCol); doc.roundedRect(x, y, tw, 5.6, 1.2, 1.2, 'F'); col(C.white); doc.text(tag, x + 2.5, y + 3.9);
    font('bold', 10); col(C.ink); doc.text(T(didascalia), x + tw + 3, y + 4.1, {maxWidth: w - tw - 3});
    const by = y + 8.5, bh = h - 8.5 - (url ? 12 : nota ? 6 : 0);
    fill(C.soft); draw(C.line); doc.setLineWidth(0.25); doc.roundedRect(x, by, w, bh, 2, 2, 'FD');
    if(img){
      const k = Math.min((w - 6)/img.w, (bh - 6)/img.h), iw = img.w*k, ih = img.h*k, ix = x + (w - iw)/2, iy = by + (bh - ih)/2;
      doc.addImage(img.data, 'JPEG', ix, iy, iw, ih, undefined, 'FAST');
      if(video){ // simbolo «play» per dire che è un fotogramma
        const cx = ix + iw/2, cy = iy + ih/2; fill([0,0,0]); doc.setGState && doc.setGState(new doc.GState({opacity:0.55})); doc.circle(cx, cy, 9, 'F'); doc.setGState && doc.setGState(new doc.GState({opacity:1}));
        fill(C.white); doc.triangle(cx-3, cy-5, cx-3, cy+5, cx+5.5, cy, 'F');
      }
    } else {
      font('bold', 11); col(C.muted); doc.text(video ? 'VIDEO' : 'FILE', x + w/2, by + bh/2 - 2, {align:'center'});
      font('normal', 9); doc.text(url ? 'Tocca il tasto qui sotto per guardarlo' : 'Inviato insieme a questo PDF', x + w/2, by + bh/2 + 4, {align:'center'});
    }
    if(url){
      doc.link(x, by, w, bh, {url});
      const tw2 = Math.min(w, 82);
      tasto(x + (w - tw2)/2, by + bh + 3, tw2, video ? '>  GUARDA IL VIDEO' : 'APRI LA FOTO ORIGINALE', url, video ? C.red : C.dark);
    } else if(nota){ font('normal', 8); col(C.muted); doc.text(T(nota), x, by + bh + 4.5, {maxWidth: w}); }
  }

  /* ---------- PAGINA 1: la richiesta ---------- */
  if(logo) doc.addImage(logo, 'PNG', M, 11, 50, 50*167/700);
  font('bold', 14); col(C.ink); doc.text('RICHIESTA DI RESO', W-M, 16, {align:'right'});
  doc.text('PER CONTESTAZIONE', W-M, 22, {align:'right'});
  font('normal', 9); col(C.muted); doc.text('Ruote truck in acciaio e in lega', W-M, 27, {align:'right'});
  fill(C.red); doc.rect(M, 31, CW, 1, 'F');
  font('bold', 10.5); col(C.ink); doc.text('Pratica ' + p.num, M, 39);
  font('normal', 10); col(C.muted); doc.text('Data richiesta: ' + dataIT(p.data), W-M, 39, {align:'right'});
  let y = 44;
  fill(C.red); doc.roundedRect(M, y, CW, 12, 2, 2, 'F');
  font('normal', 8); col(C.white); doc.text('MOTIVO', M+4, y+4.6);
  font('bold', 12); doc.text(T(p.motivo), M+4, y+9.6);
  font('bold', 12); doc.text(`${p.qta} ${p.qta===1?'RUOTA':'RUOTE'}`, W-M-4, y+7.8, {align:'right'});
  y += 18;

  y = coppia(y,
    {t:'Cliente', rows:[['Ragione sociale', p.cliente.rs], ['Codice cliente B2B', p.cliente.cod || 'da completare a cura dell\'agente'], ['Referente', p.cliente.ref], ['Telefono', p.cliente.tel]]},
    {t:'Prodotto', rows:[['Materiale', p.materiale], ['Marca', p.marca], ['Misura', p.misura], ['Codice articolo', p.codArt || 'da completare a cura dell\'agente'], ['Quantità', `${p.qta} ${p.qta===1?'ruota':'ruote'}`]]});
  const a = p.autore || {};
  y = coppia(y,

  }

  /* ---------- RUOTE: due elementi per pagina ---------- */
  for(let r=0;r<p.qta;r++){

    for(let k=0;k<el.length;k+=2){
      doc.addPage(); let yy = testataAllegati();

      const disp = BASSO - yy - 2, n = Math.min(2, el.length - k), h = (disp - (n-1)*7) / 2;
      for(let j=0;j<n;j++){

  }

  /* ---------- piè di pagina ---------- */
  const N = doc.getNumberOfPages();
  for(let i=1;i<=N;i++){
    doc.setPage(i);

  const blob = doc.output('blob');
  return {blob: new Blob([blob], {type:'application/pdf'}), nome: nomePdf(p), pagine: N, size: blob.size, creato: new Date().toISOString()};
}

function daCaricare(p){
  const out = [];
  for(let r=0;r<p.qta;r++){
    const R = p.ruote[r];
    R.front.forEach((f,i) => out.push({f, nome:`RUOTA${r+1}_ALLEGATO2_FRONTALE${R.front.length>1?'_'+(i+1):''}.${estensione(f)}`}));
    R.a3.forEach((f,i) => out.push({f, nome: isVid(f) ? nomeFileVideo(p,r,i).replace(/^ALLEGATO3_RUOTA(\d+)/,'RUOTA$1_ALLEGATO3') : `RUOTA${r+1}_ALLEGATO3_FOTO${R.a3.length>1?'_'+(i+1):''}.${estensione(f)}`}));
    R.extra.forEach((f,i) => out.push({f, nome:`RUOTA${r+1}_EXTRA_${i+1}.${estensione(f)}`}));
  }
  return out.filter(x => !x.f.url && (isImg(x.f) || isVid(x.f)) && x.f.size <= MAX_UP);
}
const base64Di = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });
async function caricaSuDrive(p){
  if(!DRIVE_URL) return;
  const lista = daCaricare(p); if(!lista.length) return;
  let ok = 0;
  try{
    for(let i=0;i<lista.length;i++){
      const {f, nome} = lista[i];
      busy(true, `Carico foto e video su Google Drive… ${i+1} di ${lista.length}` + (f.size > 5e6 ? ` (${mb(f.size)})` : ''));
      if(!p.token) p.token = uid() + uid();
      const corpo = JSON.stringify({k: DRIVE_KEY, token: p.token, pratica: p.num, cliente: p.cliente.rs, nome, tipo: f.tipo, dati: await base64Di(f.blob)});
      const r = await fetch(DRIVE_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: corpo});
      const j = await r.json();
      if(!j.ok) throw new Error(j.err || 'errore');
      f.url = j.url; p.cartellaUrl = j.cartella; ok++;
      await salva(true, false);
    }
    evento(p, `Caricati su Google Drive ${ok} ${ok===1?'file':'file'} (foto e video)`, 'b');
  }catch(e){
    if(ok) evento(p, `Caricati su Google Drive ${ok} file su ${lista.length}`, 'b');
    evento(p, 'Google Drive non raggiungibile: i video restanti partono allegati al PDF', 'r');
    toast('Google Drive non raggiungibile: i video partiranno allegati al PDF.', 3800);
  }
  await salva(true, false);
}

async function preparaPDF(p, forza){
  if(!forza && pdfAggiornato(p)) return p.pdf;
  busy(true, 'Creo il PDF…');
  try{
    const prima = !!p.pdf;
    await caricaSuDrive(p);
    busy(true, 'Creo il PDF…');
    const r = await creaPDF(p, (a, t) => busy(true, `Creo il PDF… ${a} di ${t}`));
    p.pdf = r;
    if(p.stato === 'bozza') p.stato = 'pronta';
    evento(p, `${prima ? 'PDF aggiornato' : 'PDF creato'}: ${r.pagine} pagine, ${mb(r.size)}`, 'b');
    await salva(true, false);
    return r;
  }catch(e){ console.error(e); toast('Non sono riuscito a creare il PDF: riprova.'); return null; }
  finally{ busy(false); }
}

function scarica(file){ const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 4000); }
async function invia(p, canale){
  const pdf = await preparaPDF(p); if(!pdf) return;
  const files = [new File([pdf.blob], pdf.nome, {type:'application/pdf'}), ...fileAParte(p)];
  const testo = testoMessaggio(p);
  const titolo = `Reso truck TRK ${p.num} - ${p.cliente.rs}`;
  let ok = false;
  if(navigator.share && navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files, title: titolo, text: testo}); ok = true; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  if(!ok){ // computer: scarico i file e apro WhatsApp Web o la mail con il testo pronto
    for(const f of files){ scarica(f); await new Promise(r=>setTimeout(r,350)); }
    const a = p.autore || {};
    if(canale === 'whatsapp'){
      let n = (profilo.ruolo === 'cliente' ? (profilo.agTel||'') : '').replace(/\D/g,''); if(n && n.length <= 10) n = '39' + n;
      window.open((n ? 'https://wa.me/' + n : 'https://wa.me/') + '?text=' + encodeURIComponent(testo + '\n(allega il PDF appena scaricato)'), '_blank');
    } else {
      const to = profilo.ruolo === 'cliente' ? (profilo.agMail||'') : '';
      location.href = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(titolo) + '&body=' + encodeURIComponent(testo + '\n\n(allega il PDF appena scaricato)');
    }
    toast('PDF scaricato: allegalo al messaggio.', 3500);
    ok = true;
  }
  if(ok){
    evento(p, `Inviata ${canale === 'whatsapp' ? 'su WhatsApp' : canale === 'mail' ? 'per mail' : '(salvata in File)'}: PDF${files.length>1 ? ' + ' + (files.length-1) + ' file' : ''}`, 'g');
    if(['bozza','pronta'].includes(p.stato) && canale !== 'file') p.stato = 'inviata';
    await salva(true, false);
    vista = 'scheda'; render();
    if(canale !== 'file') toast('Registrata nello storico.');
  }
}
function apriPDF(p){
  if(!p.pdf) return;
  const u = URL.createObjectURL(p.pdf.blob);
  const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}

function contaStati(){
  const c = {tutte: pratiche.length, bozza:0, inviata:0, chiusa:0};
  pratiche.forEach(p => { if(p.stato === 'bozza' || p.stato === 'pronta') c.bozza++; else if(p.stato === 'inviata') c.inviata++; else c.chiusa++; });
  return c;
}
function filtrate(){
  const q = cerca.trim().toLowerCase();
  return pratiche.filter(p => {
    if(filtro === 'bozza' && !['bozza','pronta'].includes(p.stato)) return false;
    if(filtro === 'inviata' && p.stato !== 'inviata') return false;
    if(filtro === 'chiusa' && !['accettata','respinta','chiusa'].includes(p.stato)) return false;
    if(!q) return true;
    return [p.num, p.cliente.rs, p.cliente.cod, p.marca, p.misura, p.codArt, p.motivo].join(' ').toLowerCase().includes(q);
  });
}

    ${hint ? `<div class="hint">${hint}</div>` : ''}
    ${lista.length ? `<div class="thumbs">${lista.map(f => `<div class="th">${isImg(f) ? `<img src="${urlDi(f)}" alt="">` : isVid(f) ? `<video src="${urlDi(f)}#t=0.1" muted playsinline preload="metadata"></video><span class="vb">▶ ${mb(f.size)}</span>` : `<span>📄<br>${esc(estensione(f).toUpperCase())}</span>`}<button class="x" data-act="togli" data-slot="${chiave}" data-id="${f.id}" aria-label="Togli">✕</button></div>`).join('')}</div>` : ''}
    <div class="addrow">${accetta.map(a => `<label class="addbtn">${a.lbl}<input type="file" data-slot="${chiave}" accept="${a.acc}" ${a.cap ? 'capture="environment"' : ''} ${a.multi ? 'multiple' : ''}></label>`).join('')}</div>
  </div>`;
}

function s3(p){
  const mo = MOTIVI[p.motivo];

  const a3Acc = isVideo ? [{lbl:'🎥 Registra', acc:'video/*', cap:true}, {lbl:'🖼 Dalla galleria', acc:'video/*', multi:true}] : fotoAcc;
  const mf = mancantiFile(p);
  let h = `
    <div class="banner ${mf.length?'red':'ok'}"><span class="ic">${mf.length?'📋':'✅'}</span><div>${mf.length ? `<b>Servono tante foto e video quante sono le ruote.</b> Mancano ancora ${mf.length} ${mf.length===1?'elemento':'elementi'}.` : '<b>Tutto il materiale c\'è.</b> Tocca «Avanti» per creare il PDF.'}</div></div>

      ${slotFile('ddt', p.ddt, 'DDT o fattura di acquisto', 'ALLEGATO 1', 'a1', 'Dati del documento e descrizione della merce ben visibili e leggibili.', [{lbl:'📷 Fotografa', acc:'image/*', cap:true}, {lbl:'📄 Foto o PDF', acc:'image/*,application/pdf', multi:true}])}
    </div>`;
  for(let i=0;i<p.qta;i++){
    const r = p.ruote[i];
    const ok = r.front.length && r.a3.length;
    h += `<div class="card wheel"><h3><span>Ruota ${i+1}${p.qta>1?' di '+p.qta:''}</span>${ok?'<span class="tag okt">✓ completa</span>':''}</h3>
      ${slotFile(`front.${i}`, r.front, 'Foto frontale con la marcatura', 'ALLEGATO 2', 'a2', 'Marca, codice, misura, data di fabbricazione e matricola leggibili. Sulla lega la data è sul bordo interno.', fotoAcc)}
      ${slotFile(`a3.${i}`, r.a3, esc(mo.a3), 'ALLEGATO 3', 'a3', esc(mo.a3hint), a3Acc)}
      ${slotFile(`extra.${i}`, r.extra, 'Altre foto (facoltative)', 'EXTRA', '', 'Utile: l\'interno della ruota con le basi di appoggio al mozzo.', [{lbl:'📷 Scatta', acc:'image/*', cap:true}, {lbl:'🖼 Galleria', acc:'image/*,video/*', multi:true}], true)}
      <label class="f" for="mat-${i}">Matricola (se leggibile)</label>
      <input type="text" id="mat-${i}" data-f="ruote.${i}.matricola" value="${esc(r.matricola)}" autocapitalize="characters">
    </div>`;
  }
  if(isVideo) h += `<p class="hint">Video brevi (10–20 secondi): pesano meno e partono prima. Nel PDF va un fotogramma di ogni video, il video parte insieme al PDF.</p>`;
  return h;
}

/* =================== STORICO PER EXCEL =================== */
function esportaCSV(){
  const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const righe = [['Pratica','Data','Stato','Cliente','Codice B2B','Materiale','Marca','Misura','Codice articolo','Ruote','Motivo','Inviata il','Esito nota','Ultimo evento'].map(q).join(';')];
  pratiche.forEach(p => {
    const inv = (p.eventi||[]).find(e => e.cosa.startsWith('Inviata')); const ul = (p.eventi||[]).slice(-1)[0];
    righe.push([p.num, dataIT(p.data), STATI[p.stato], p.cliente.rs, p.cliente.cod, p.materiale, p.marca, p.misura, p.codArt, p.qta, p.motivo, inv ? oraIT(inv.t) : '', p.esito && p.esito.note, ul ? ul.cosa + ' (' + oraIT(ul.t) + ')' : ''].map(q).join(';'));
  });
  const f = new File(['﻿' + righe.join('\r\n')], `Storico resi TRK ${oggiISO()}.csv`, {type:'text/csv'});
  if(navigator.canShare && navigator.canShare({files:[f]})) navigator.share({files:[f]}).catch(()=>{}); else scarica(f);
}

/* =================== EVENTI =================== */
function setPath(obj, path, val){ const k = path.split('.'); let o = obj; for(let i=0;i<k.length-1;i++) o = o[k[i]]; o[k[k.length-1]] = val; }
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.f && cur){ setPath(cur, t.dataset.f, t.value); salva(); }
  if(t.dataset.p){ profilo = profilo || {}; profilo[t.dataset.p] = t.value; }
  if(t.id === 'cerca'){ cerca = t.value; const l = $('#lista'); const lista = filtrate(); if(l){ const tmp = document.createElement('div'); vHomeLista(tmp, lista); l.innerHTML = tmp.innerHTML; } }
});
function rigaLista(p){
  const ul = (p.eventi||[]).slice(-1)[0];
  return `<div class="it" data-act="menu" data-id="${p.id}" role="button" tabindex="0">
    <div><div class="a">${esc(p.cliente.rs || 'Senza cliente')} · ${p.qta} ${p.qta===1?'ruota':'ruote'}</div>
    <div class="b">${esc([p.marca, p.misura].filter(Boolean).join(' · ') || 'Prodotto da scegliere')}${p.motivo ? ' · ' + esc(p.motivo.toLowerCase()) : ''}</div>
    <div class="c">${esc(p.num)} · ${ul ? esc(ul.cosa) + ' · ' + oraIT(ul.t) : dataIT(p.data)}</div></div>
    <div class="dx"><span class="pill ${p.stato}">${STATI[p.stato]}</span><span class="menu" aria-hidden="true">⋯</span></div></div>`;
}
function vHomeLista(el, lista){ el.innerHTML = lista.length ? lista.map(rigaLista).join('') : '<p class="muted" style="margin:0">Nessuna richiesta trovata.</p>'; }

/* =================== MENU DEL RESO: apri, esito, elimina =================== */
function chiudiMenu(){ const v = $('#velo'); if(v) v.remove(); }
function apriMenu(p){
  chiudiMenu();
  const chiusa = ['accettata','respinta','chiusa'].includes(p.stato);
  const v = document.createElement('div'); v.id = 'velo'; v.className = 'velo';
  v.innerHTML = `<div class="sheet" role="dialog" aria-label="Cosa vuoi fare con questo reso">
    <div class="mani"></div>
    <div class="tt"><b>${esc(p.cliente.rs || 'Senza cliente')}</b><span class="pill ${p.stato}">${STATI[p.stato]}</span></div>
    <div class="sb">Pratica ${esc(p.num)} · ${esc([p.marca, p.misura].filter(Boolean).join(' · ') || 'prodotto da scegliere')} · ${p.qta} ${p.qta===1?'ruota':'ruote'}</div>
    <button class="btn primary" data-act="apri" data-id="${p.id}">${p.stato === 'bozza' ? 'Continua la richiesta' : 'Apri la pratica'}</button>
    <div class="card" style="margin:12px 0 0">
      <h3>Esito del reso</h3>
      <label class="f" for="m-nota" style="margin-top:4px">Nota (facoltativa)</label>
      <textarea id="m-nota" placeholder="Es. sostituzione approvata, nota di credito n. …">${esc(p.esito && p.esito.note)}</textarea>
      <div class="grid2" style="margin-top:10px"><button class="btn ok" data-act="esitoMenu" data-id="${p.id}" data-v="accettata">✓ Accettato</button><button class="btn no" data-act="esitoMenu" data-id="${p.id}" data-v="respinta">✕ Rifiutato</button></div>
      ${chiusa ? `<button class="btn" data-act="esitoMenu" data-id="${p.id}" data-v="riapri" style="margin-top:10px">Rimetti in attesa</button>` : ''}
    </div>
    <button class="btn del" data-act="eliminaMenu" data-id="${p.id}" style="margin-top:12px">Elimina il reso${p.cartellaUrl ? ' (anche foto e video su Drive)' : ''}</button>
    <button class="btn" data-act="chiudiMenu" style="margin-top:10px">Annulla</button>
  </div>`;
  v.addEventListener('click', e => { if(e.target === v) chiudiMenu(); });
  document.body.appendChild(v);
}
async function eliminaDaDrive(p){
  if(!DRIVE_URL || !p.cartellaUrl) return true;
  try{
    const r = await fetch(DRIVE_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({k: DRIVE_KEY, azione:'elimina', pratica: p.num, token: p.token || ''})});
    const j = await r.json(); return !!j.ok;
  }catch(e){ return false; }
}
async function eliminaPratica(p){
  if(!confirm(`Elimino il reso ${p.num} (${p.cliente.rs || 'senza cliente'}) con PDF, foto e video${p.cartellaUrl ? ', anche dalla cartella su Google Drive' : ''}? Non si può annullare.`)) return false;
  busy(true, 'Elimino…');
  const ok = await eliminaDaDrive(p);
  await DB.del(p.id); busy(false);
  if(cur && cur.id === p.id) cur = null;
  await carica(); chiudiMenu(); vista = 'home'; render();
  toast(ok ? 'Reso eliminato.' : 'Reso eliminato dall\'app. La cartella su Google Drive va tolta a mano.', ok ? 2600 : 4500);
  return true;
}

document.addEventListener('change', async e => {
  const t = e.target;
  if(t.dataset.p){ profilo[t.dataset.p] = t.value; }
  if(t.type === 'file' && t.dataset.slot && cur){
    const files = [...t.files]; if(!files.length) return;
    const [k, i] = t.dataset.slot.split('.');
    const lista = k === 'ddt' ? cur.ddt : cur.ruote[+i][k];
    await aggiungiFile(lista, files);
    render(true);
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.matches('[role=button]')) e.target.click(); });

async function vaiPasso4(){
  step = 3; render();
  if(!mancantiTutto(cur).length && !pdfAggiornato(cur)){ await preparaPDF(cur); render(); }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  const p = cur;
  switch(a){
    case 'ruolo': profilo = Object.assign({}, profilo || {}, {ruolo: v, _nuovo: true}); vista = 'profilo'; render(); break;
    case 'profilo': vista = 'profilo'; render(); break;
    case 'chi': profilo = ls.get('trk-resi-profilo', null); vista = profilo ? 'home' : 'chi'; render(); break;
    case 'cambiaRuolo': profilo = Object.assign({}, profilo, {ruolo: profilo.ruolo === 'agente' ? 'cliente' : 'agente', _nuovo: true}); render(); break;
    case 'tema': ls.set('trk-resi-tema', v); applicaTema(); render(); break;
    case 'salvaProfilo': {
      const ag = profilo.ruolo === 'agente';
      const req = ag ? [['nome','Nome e cognome'],['mail','Mail'],['resp','Responsabile truck']] : [['rs','Ragione sociale'],['ref','Nome di chi segue la richiesta'],['tel','Telefono']];
      const manca = req.filter(([k]) => !(profilo[k]||'').trim());
      if(manca.length){ toast('Manca: ' + manca.map(x=>x[1]).join(', ')); return; }
      if(ag && !/^\S+@\S+\.\S+$/.test(profilo.mail.trim())){ toast('La mail non sembra corretta.'); return; }
      delete profilo._nuovo; ls.set('trk-resi-profilo', profilo);
      vista = importDati ? 'import' : 'home';
      render(); break;
    }
    case 'guida': vista = 'guida'; render(); break;
    case 'trasporto': vista = 'trasporto'; render(); break;
    case 'home': case 'casa': if(cur) await salva(true, false); cur = null; await carica(); vista = 'home'; if(importDati){ importDati = null; history.replaceState(null,'',location.pathname); } render(); break;
    case 'filtro': filtro = v; render(true); break;
    case 'csv': esportaCSV(); break;
    case 'nuova': cur = nuovaPratica(); await salva(true); step = 0; vista = 'step'; render(); break;
    case 'apri': {
      chiudiMenu();
      cur = pratiche.find(x => x.id === el.dataset.id); if(!cur) return;
      if(cur.stato === 'bozza'){ const s = primoPassoIncompleto(cur); vista = 'step'; if(s === 3) await vaiPasso4(); else { step = s; render(); } }
      else { vista = 'scheda'; render(); }
      break;
    }
    case 'indietro':
      if(step === 0){ await salva(true, false); cur = null; await carica(); vista = 'home'; render(); }
      else { step--; render(); }
      break;
    case 'avanti': {
      const m = [mancantiDati, mancantiMotivo, mancantiFile][step](p);
      if(step < 2 && m.length){ toast('Manca: ' + m.join(', '), 3600); return; }
      if(step === 1) { const ev = 'Motivo: ' + cap(p.motivo); if(!(p.eventi||[]).some(x => x.cosa === ev)) evento(p, ev, 'n'); }
      await salva(true);
      if(step === 2){ if(m.length) toast('Mancano ancora ' + m.length + ' elementi.', 3000); await vaiPasso4(); }
      else { step++; render(); }
      break;
    }
    case 'vaiStep': step = +v; vista = 'step'; render(); break;
    case 'set': p[el.dataset.k] = v; salva(); render(true); break;
    case 'qta': {
      const n = Math.max(1, Math.min(MAXQ, p.qta + (+v)));
      if(n < p.qta){ const r = p.ruote[p.qta-1]; if(r && (r.front.length || r.a3.length || r.extra.length) && !confirm(`La ruota ${p.qta} ha già foto o video: li tolgo?`)) return; p.ruote.length = Math.max(n, 1); }
      p.qta = n; allineaRuote(p); salva(); render(true); break;
    }
    case 'motivo': if(p.motivo !== v){ p.motivo = v; p.verificato = false; } salva(); render(true); break;
    case 'verif': p.verificato = el.checked; salva(); break;
    case 'togli': {
      const [k, i] = el.dataset.slot.split('.');
      const lista = k === 'ddt' ? p.ddt : p.ruote[+i][k];
      const ix = lista.findIndex(f => f.id === el.dataset.id); if(ix >= 0) lista.splice(ix, 1);
      await salva(true); render(true); break;
    }
    case 'apriPdf': apriPDF(p); break;
    case 'rifaiPdf': await preparaPDF(p, true); render(true); break;
    case 'invia': await invia(p, v); break;
    case 'modulo': window.open(urlModulo(p), '_blank'); evento(p, 'Aperto il modulo RESO TRUCK compilato', 'n'); salva(true, false); break;
    case 'spuntaModulo':
      p.passi.modulo = !p.passi.modulo;
      evento(p, p.passi.modulo ? 'Modulo RESO TRUCK inviato' : 'Modulo RESO TRUCK: tolta la spunta', p.passi.modulo ? 'g' : 'n');
      await salva(true, false); render(true); break;
    case 'esito': {
      if(p.stato === v) return;
      p.stato = v; evento(p, 'Esito: ' + ({inviata:'in attesa', accettata:'accettata', respinta:'rifiutata', chiusa:'chiusa'})[v], v === 'respinta' ? 'r' : v === 'inviata' ? 'n' : 'g');
      await salva(true, false); render(true); break;
    }
    case 'salvaNota': { const t = $('#e-note').value.trim(); p.esito = p.esito || {}; if(t === (p.esito.note||'')) { toast('Nessuna modifica.'); return; } p.esito.note = t; evento(p, 'Nota esito: ' + (t || '(cancellata)'), 'n'); await salva(true, false); render(true); toast('Nota salvata.'); break; }
    case 'modifica': evento(p, 'Riaperta per modifiche', 'n'); await salva(true, false); step = 0; vista = 'step'; render(); break;
    case 'duplica': {
      const n = nuovaPratica();
      Object.assign(n, {cliente: {...p.cliente}, materiale: p.materiale, marca: p.marca, misura: p.misura, codArt: p.codArt, motivo: p.motivo, ddtNum: p.ddtNum, ddtData: p.ddtData});
      n.eventi = []; evento(n, 'Creata duplicando la pratica ' + p.num, 'n');
      cur = n; await salva(true); step = 0; vista = 'step'; render(); toast('Copia creata: cambia quello che serve e aggiungi le foto.', 3200); break;
    }
    case 'elimina': await eliminaPratica(p); break;
    case 'menu': { const q = pratiche.find(x => x.id === el.dataset.id); if(q) apriMenu(q); break; }
    case 'chiudiMenu': chiudiMenu(); break;
    case 'eliminaMenu': { const q = pratiche.find(x => x.id === el.dataset.id); if(q) await eliminaPratica(q); break; }
    case 'esitoMenu': {
      const q = pratiche.find(x => x.id === el.dataset.id); if(!q) return;
      const nota = ($('#m-nota') ? $('#m-nota').value.trim() : '');
      q.esito = q.esito || {};
      if(nota !== (q.esito.note || '')){ q.esito.note = nota; if(nota) evento(q, 'Nota esito: ' + nota, 'n'); }
      if(v === 'riapri'){ q.stato = (q.eventi||[]).some(x => x.cosa.startsWith('Inviata')) ? 'inviata' : (q.pdf ? 'pronta' : 'bozza'); evento(q, 'Esito tolto: di nuovo in attesa', 'n'); }
      else { q.stato = v; evento(q, v === 'accettata' ? 'Esito: ACCETTATO' : 'Esito: RIFIUTATO', v === 'accettata' ? 'g' : 'r'); }
      q.agg = new Date().toISOString(); await DB.put(q);
      chiudiMenu(); await carica(); render(true);
      toast(v === 'riapri' ? 'Reso di nuovo in attesa.' : v === 'accettata' ? 'Salvato come ACCETTATO.' : 'Salvato come RIFIUTATO.');
      break;
    }
    case 'importa': {
      const d = importDati; const n = nuovaPratica();
      n.data = d.data || oggiISO();
      n.cliente = {rs: (d.c&&d.c.rs)||'', cod: (d.c&&d.c.cod)||'', ref: (d.c&&d.c.ref)||'', tel: (d.c&&d.c.tel)||''};
      if(MATERIALI.includes(d.m)) n.materiale = d.m; if(MARCHE.includes(d.b)) n.marca = d.b; if(MISURE.includes(d.s)) n.misura = d.s;
      n.codArt = d.a || ''; n.qta = Math.max(1, Math.min(MAXQ, +d.q || 1)); if(MOTIVI[d.o]) n.motivo = d.o;
      n.ddtNum = d.dn || ''; n.ddtData = d.dd || ''; n.note = d.n || ''; n.origine = 'cliente';
      if(d.num) n.num = d.num;
      if(d.tk) n.token = d.tk;
      allineaRuote(n); (d.r||[]).forEach((m,i) => { if(n.ruote[i]) n.ruote[i].matricola = m; });
      n.eventi = []; evento(n, 'Importata dal link del cliente', 'b');
      cur = n; await salva(true); importDati = null; history.replaceState(null,'',location.pathname);
      step = 0; vista = 'step'; render(); toast('Importata. Controlla i dati e completa codice B2B e codice articolo.', 3400); break;
    }
  }
});

function applicaTema(){ const t = ls.get('trk-resi-tema','auto'); if(t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }

/* =================== AVVIO =================== */
(async function(){
  applicaTema();
  const m = location.hash.match(/#p=([\w-]+)/);
  if(m){ try{ importDati = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))))); }catch(e){ importDati = null; } }
  await carica();
  vista = !profilo ? 'chi' : importDati ? 'import' : 'home';
  render();
  caricaLogo();
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
